name: Task
description: Maintenance, documentation, tooling or harness work.
title: "chore: "
labels: ["chore"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: Work to do

name: Bug
description: Something does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Security vulnerability? Do not file it here; use private reporting (see SECURITY.md)."
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error output. Remove secrets and personal data first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, WSL2 or dev container, agent and version if relevant.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria for the fix
    validations:
      required: true

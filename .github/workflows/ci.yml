# Checks every pull request and every push to main: the same checks as
# `make ci` on your machine. Mark the "Checks" job as required on main
# (docs/development/github-setup.md). How it is built and how projects adapt
# it: docs/development/ci-template.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: a pull request can't use this workflow to change the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads every commit
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pipx install pre-commit==4.7.0

      - name: Run the checks
        run: make ci

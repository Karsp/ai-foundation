# Checks that run on every `git commit` in this clone, and in CI on every PR
# (`make ci`, .github/workflows/ci.yml).
# Install once per clone: `make setup` (see docs/development/environment.md).
# Versions are pinned to a commit SHA, with the release in the comment
# (docs/security/supply-chain.md). Update them through a PR.
repos:
  # Secrets (docs/security/secrets.md)
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks # on commit: the staged changes
      - id: gitleaks # `make security` and CI: every commit in the history
        alias: gitleaks-history
        name: Scan the Git history for secrets
        entry: gitleaks git --redact --verbose
        stages: [manual]

  # Basic file hygiene, YAML and JSON syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$ # JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # Schemas for GitHub workflows and Dependabot
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
        files: &workflows ^(\.github/workflows/|docs/development/ci/).*\.ya?ml$
      - id: check-dependabot

  # GitHub Actions workflows: syntax, expressions, script injection
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        files: *workflows # also the example in docs/development/ci/

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  # Markdown style (.markdownlint-cli2.yaml)
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2

  # Relative links and headings in Markdown (no network)
  - repo: local
    hooks:
      - id: check-links
        name: Check Markdown links
        entry: python3 scripts/check_links.py
        language: system
        types: [markdown]
